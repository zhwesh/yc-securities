# 开发环境配置文件

# mysql数据库数据源
datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  host: localhost
  port: 3306
  database: yc_securities
  username: root
  password: 123456
# 阿里云
alioss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucketName: yc-securities
  region: cn-beijing
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
# redis数据库
redis:
  host: localhost
  port: 6379
  password: 123456

# 开发环境JWT密钥
jwt:
  secret-key: yc-securities-hs256-secret-key-2026-zhwesh-0123456789

# 开发环境：24小时连续交易，集合竞价和定时聚合按开发演示模式处理
trading:
  always-on: true
  call-auction-enabled: true
  kline-aggregation-enabled: true
  snapshot-enabled: true

# 模拟渠道
integration:
  bank-channel-bean: bankChannelUtilTestImpl
  sms-bean: smsSenderTestImpl
  funding-bean: fundingChannelUtilTestImpl